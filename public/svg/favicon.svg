<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Brother Femi favicon">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0288d1"/>
      <stop offset="100%" stop-color="#17445e"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#bg)"/>

  <!-- Cross: vertical bar -->
  <rect x="13.5" y="6" width="5" height="20" rx="1.5" fill="white"/>

  <!-- Cross: horizontal bar -->
  <rect x="7" y="11" width="18" height="5" rx="1.5" fill="white"/>

  <!-- Crown dots -->
  <circle cx="13.5" cy="8" r="1.5" fill="#4dd0e1"/>
  <circle cx="16" cy="4" r="1.5" fill="#4dd0e1"/>
  <circle cx="18.5" cy="8" r="1.5" fill="#4dd0e1"/>
</svg>
