<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 100" role="img" aria-label="Brother Femi logo">
  <!-- Icon circle -->
  <circle cx="50" cy="50" r="44" fill="#1a2744"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="#c9a84c" stroke-width="1.2"/>
  <!-- Cross -->
  <rect x="46" y="16" width="8" height="40" rx="2" fill="#c9a84c"/>
  <rect x="30" y="28" width="40" height="8" rx="2" fill="#c9a84c"/>
  <!-- BF below cross -->
  <text x="50" y="76" font-family="Georgia, 'Book Antiqua', serif" font-size="13" font-weight="bold" fill="#c9a84c" text-anchor="middle" letter-spacing="4" opacity="0.9">BF</text>

  <!-- Vertical divider -->
  <line x1="106" y1="14" x2="106" y2="86" stroke="#c9a84c" stroke-width="0.75" opacity="0.5"/>

  <!-- BROTHER FEMI wordmark -->
  <text x="120" y="46" font-family="Georgia, 'Book Antiqua', serif" font-size="22" font-weight="bold" fill="#c9a84c" letter-spacing="3">BROTHER FEMI</text>

  <!-- Separator -->
  <line x1="120" y1="55" x2="372" y2="55" stroke="#c9a84c" stroke-width="0.5" opacity="0.4"/>

  <!-- Tagline -->
  <text x="120" y="70" font-family="Georgia, 'Book Antiqua', serif" font-size="11" font-weight="bold" fill="#f5f0e8" letter-spacing="4">BOND SERVANT OF CHRIST</text>

  <!-- URL -->
  <text x="122" y="84" font-family="'Trebuchet MS', Arial, sans-serif" font-size="8" fill="#c9a84c" letter-spacing="3" opacity="0.8">· BROTHERFEMI.ORG ·</text>
</svg>
